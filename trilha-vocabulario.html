<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha de Vocabulário — 500 Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#faf7f0; --ink:#1f2a44; --ink-soft:#5b6478;
  --teal:#2f6f62; --teal-deep:#1f4c43;
  --amber:#c98a3e; --amber-deep:#8f5f24;
  --red:#b9483f; --red-deep:#8a332c;
  --line:#e4ddca; --card:#ffffff;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;min-height:100%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171a22; --ink:#f1ede2; --ink-soft:#a9a48f;
    --card:#20242f; --line:#333a4a;
    --teal:#4fa08e; --amber:#e0a35c; --red:#e07268;
  }
}
:root[data-theme="dark"]{
  --paper:#171a22; --ink:#f1ede2; --ink-soft:#a9a48f;
  --card:#20242f; --line:#333a4a;
  --teal:#4fa08e; --amber:#e0a35c; --red:#e07268;
}
header{
  padding:18px 20px 14px;max-width:640px;margin:0 auto;width:100%;
}
.top-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:"Fraunces",serif;font-size:1.15rem;font-weight:600;margin:0;letter-spacing:.2px}
.score{font-size:.95rem;color:var(--ink-soft);white-space:nowrap}
.score b{color:var(--teal);font-size:1.05rem}
.progress-track{height:6px;border-radius:4px;background:var(--line);margin-top:14px;overflow:hidden}
.progress-fill{height:100%;background:var(--teal);border-radius:4px;transition:width .4s ease}
.progress-label{font-size:.78rem;color:var(--ink-soft);margin-top:6px}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;max-width:640px;margin:0 auto;width:100%}

.card{
  width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:36px 28px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.eng-word{font-family:"Fraunces",serif;font-size:2.6rem;font-weight:600;margin:0 0 6px;word-break:break-word}
.hint-btn{
  background:none;border:1px solid var(--line);color:var(--ink-soft);
  font:inherit;font-size:.85rem;padding:6px 14px;border-radius:20px;cursor:pointer;margin-top:8px;
}
.hint-btn:hover{border-color:var(--teal);color:var(--teal)}
.reveal{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);text-align:left;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.reveal .pt{font-size:1.15rem;font-weight:700;color:var(--teal-deep)}
:root:not([data-theme="light"]) .reveal .pt{color:var(--teal)}
.reveal .example{margin-top:10px;font-size:1rem;line-height:1.5;color:var(--ink)}
.reveal .example em{color:var(--ink-soft);font-style:normal}

.actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.actions button{
  flex:1 1 0;min-width:100px;font:inherit;font-weight:700;font-size:.92rem;
  padding:13px 10px;border-radius:12px;border:none;cursor:pointer;color:#fff;
  transition:transform .12s ease, filter .12s ease;
}
.actions button:active{transform:scale(.97)}
#btn-aprendi{background:var(--teal)}
#btn-revisar{background:var(--amber)}
#btn-esqueci{background:var(--red)}
.actions button:disabled{opacity:.45;cursor:not-allowed}
.actions button small{display:block;font-weight:500;font-size:.72rem;opacity:.85;margin-top:2px}

.repo-toggle{
  margin-top:22px;background:none;border:none;color:var(--ink-soft);
  font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;
}
.repo{
  width:100%;margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;max-height:220px;overflow-y:auto;
}
.repo h2{font-size:.85rem;text-transform:none;margin:0 0 10px;color:var(--ink-soft);font-weight:700}
.repo ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.repo li{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.85rem}

.done{text-align:center}
.done h2{font-family:"Fraunces",serif;font-size:1.8rem;margin-bottom:8px}
.reset-link{margin-top:26px;background:none;border:none;color:var(--ink-soft);font:inherit;font-size:.8rem;text-decoration:underline;cursor:pointer}
footer{text-align:center;font-size:.75rem;color:var(--ink-soft);padding:10px 20px 24px}
</style>
</head>
<body>
<header>
  <div class="top-row">
    <h1>Trilha de Vocabulário</h1>
    <div class="score">⭐ <b id="score">0</b> pontos</div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="progress-label" id="progress-label">0 de 0 palavras aprendidas</div>
</header>

<main>
  <div class="card" id="card"></div>
  <button class="repo-toggle" id="repo-toggle">Ver repositório de palavras pendentes</button>
  <div class="repo" id="repo" style="display:none">
    <h2>Palavras para revisar / esquecidas</h2>
    <ul id="repo-list"></ul>
  </div>
  <button class="reset-link" id="reset-link">Reiniciar progresso</button>
</main>

<footer>Seu progresso fica salvo neste navegador.</footer>

<script>
// word, pt meaning, example sentence
const WORDS = [
["water","água","I drink water every morning."],
["time","tempo","I don't have time today."],
["house","casa","We bought a new house."],
["food","comida","The food here is delicious."],
["friend","amigo(a)","She is my best friend."],
["family","família","I love my family."],
["work","trabalho","I have a lot of work today."],
["school","escola","The children go to school by bus."],
["book","livro","I read a book every night."],
["phone","telefone","Can I use your phone?"],
["city","cidade","Paris is a beautiful city."],
["money","dinheiro","I need more money."],
["day","dia","Have a nice day!"],
["night","noite","We arrived late at night."],
["morning","manhã","I go for a run every morning."],
["week","semana","See you next week."],
["month","mês","This is my favorite month."],
["year","ano","Happy new year!"],
["today","hoje","What are you doing today?"],
["tomorrow","amanhã","I will call you tomorrow."],
["yesterday","ontem","I saw her yesterday."],
["love","amor / amar","I love this song."],
["happy","feliz","She looks very happy."],
["sad","triste","Don't be sad."],
["angry","bravo(a)","He was angry about the delay."],
["tired","cansado(a)","I'm tired after work."],
["hungry","com fome","Are you hungry?"],
["thirsty","com sede","I'm thirsty, can I have some water?"],
["big","grande","They live in a big house."],
["small","pequeno(a)","It's a small problem."],
["fast","rápido(a)","He drives very fast."],
["slow","lento(a)","The train was slow today."],
["hot","quente","The coffee is too hot."],
["cold","frio(a)","It's cold outside."],
["new","novo(a)","I bought a new car."],
["old","velho(a) / antigo(a)","This is an old building."],
["good","bom / boa","It's a good idea."],
["bad","ruim / mau","The weather is bad today."],
["easy","fácil","The test was easy."],
["difficult","difícil","This question is difficult."],
["beautiful","lindo(a)","What a beautiful view!"],
["expensive","caro(a)","This restaurant is expensive."],
["cheap","barato(a)","I found a cheap flight."],
["early","cedo","We woke up early."],
["late","tarde / atrasado(a)","Sorry I'm late."],
["near","perto","The store is near my house."],
["far","longe","The airport is far from here."],
["open","aberto(a)","Is the store open?"],
["closed","fechado(a)","The museum is closed on Mondays."],
["clean","limpo(a)","Keep your room clean."],
["dirty","sujo(a)","My shoes are dirty."],
["strong","forte","He is very strong."],
["weak","fraco(a)","I feel weak today."],
["rich","rico(a)","They are very rich."],
["young","jovem","She is young and talented."],
["healthy","saudável","Eat healthy food."],
["sick","doente","He is sick today."],
["busy","ocupado(a)","I'm busy this week."],
["free","livre / grátis","Are you free tonight?"],
["safe","seguro(a)","This area is safe at night."],
["dangerous","perigoso(a)","That road is dangerous."],
["quiet","quieto(a) / silencioso(a)","Please be quiet."],
["loud","alto(a) / barulhento(a)","The music is too loud."],
["dark","escuro(a)","The room is very dark."],
["light","claro(a) / luz","Turn on the light."],
["wet","molhado(a)","My clothes are wet."],
["dry","seco(a)","The towel is dry."],
["soft","macio(a)","This pillow is very soft."],
["hard","duro(a) / difícil","The bread is hard."],
["sweet","doce","This cake is too sweet."],
["different","diferente","We have different opinions."],
["same","mesmo(a)","We live in the same city."],
["important","importante","This meeting is important."],
["possible","possível","Is it possible to change the date?"],
["true","verdadeiro(a)","Is this story true?"],
["wrong","errado(a)","You took the wrong turn."],
["right","certo(a) / direita","You are right about that."],
["world","mundo","She traveled around the world."],
["people","pessoas","Many people were at the party."],
["life","vida","I love my life."],
["job","emprego","She got a new job."],
["idea","ideia","That's a great idea."],
["problem","problema","We have a problem."],
["question","pergunta","Can I ask a question?"],
["answer","resposta","I don't know the answer."],
["story","história","Tell me a story."],
["place","lugar","This is a nice place."],
["way","caminho / jeito","I know the way home."],
["thing","coisa","I need to buy a few things."],
["word","palavra","What does this word mean?"],
["language","idioma","English is a global language."],
["name","nome","What is your name?"],
["number","número","Choose a number from one to ten."],
["color","cor","What is your favorite color?"],
["weather","clima / tempo","The weather is nice today."],
["travel","viajar","I love to travel."],
["learn","aprender","I want to learn English."],
["teach","ensinar","She teaches math."],
["remember","lembrar","I remember your name."],
["forget","esquecer","Don't forget your keys."]
];

const STORE_KEY = "trilha_vocab_v1";
let state;

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { queue: WORDS.map((_,i)=>i), learned: [], score: 0, revealed:false };
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

function render(){
  const total = WORDS.length;
  const learnedCount = state.learned.length;
  document.getElementById("score").textContent = state.score;
  document.getElementById("progress-fill").style.width = (learnedCount/total*100)+"%";
  document.getElementById("progress-label").textContent = learnedCount+" de "+total+" palavras aprendidas";

  const repoList = document.getElementById("repo-list");
  repoList.innerHTML = "";
  state.queue.slice(1).forEach(idx=>{
    const li = document.createElement("li");
    li.textContent = WORDS[idx][0];
    repoList.appendChild(li);
  });
  document.getElementById("repo-toggle").textContent =
    "Ver repositório de palavras pendentes ("+Math.max(state.queue.length-1,0)+")";

  const card = document.getElementById("card");
  if(state.queue.length === 0){
    card.innerHTML =
      '<div class="done"><h2>🎉 Trilha concluída!</h2>'+
      '<p>Você aprendeu todas as '+total+' palavras desta trilha e somou <b>'+state.score+'</b> pontos.</p></div>';
    return;
  }

  const idx = state.queue[0];
  const [word, pt, example] = WORDS[idx];
  let html = '<p class="eng-word">'+word+'</p>';
  if(!state.revealed){
    html += '<button class="hint-btn" id="reveal-btn">Mostrar significado</button>';
  } else {
    html += '<button class="hint-btn" id="reveal-btn" style="display:none"></button>'+
      '<div class="reveal"><div class="pt">'+pt+'</div>'+
      '<div class="example">'+example+'</div></div>';
  }
  html +=
    '<div class="actions">'+
      '<button id="btn-aprendi" '+(state.revealed?'':'disabled')+'>APRENDI<small>+10 pontos</small></button>'+
      '<button id="btn-revisar" '+(state.revealed?'':'disabled')+'>REVISAR DEPOIS<small>0 pontos</small></button>'+
      '<button id="btn-esqueci" '+(state.revealed?'':'disabled')+'>ESQUECI<small>0 pontos</small></button>'+
    '</div>';
  card.innerHTML = html;

  const revealBtn = document.getElementById("reveal-btn");
  if(revealBtn) revealBtn.addEventListener("click", ()=>{
    state.revealed = true; saveState(); render();
  });
  const a = document.getElementById("btn-aprendi");
  const r = document.getElementById("btn-revisar");
  const f = document.getElementById("btn-esqueci");
  if(a) a.addEventListener("click", ()=> advance("aprendi"));
  if(r) r.addEventListener("click", ()=> advance("revisar"));
  if(f) f.addEventListener("click", ()=> advance("esqueci"));
}

function advance(action){
  const idx = state.queue.shift();
  if(action === "aprendi"){
    state.score += 10;
    state.learned.push(idx);
  } else {
    // volta para o repositório, um pouco mais adiante na fila
    const insertAt = Math.min(state.queue.length, 5);
    state.queue.splice(insertAt, 0, idx);
  }
  state.revealed = false;
  saveState();
  render();
}

document.getElementById("repo-toggle").addEventListener("click", ()=>{
  const repo = document.getElementById("repo");
  repo.style.display = repo.style.display === "none" ? "block" : "none";
});
document.getElementById("reset-link").addEventListener("click", ()=>{
  if(confirm("Reiniciar todo o progresso desta trilha?")){
    localStorage.removeItem(STORE_KEY);
    state = loadState();
    render();
  }
});

state = loadState();
render();
</script>
</body>
</html>
